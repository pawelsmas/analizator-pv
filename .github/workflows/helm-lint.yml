name: Helm Lint

on:
  push:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'
  workflow_dispatch:

jobs:
  helm-lint:
    name: Lint and Template Helm Chart
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Helm Lint
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine/helm:3.14.0 lint deploy/helm/pv-portal
          echo "✓ Helm lint passed"

      - name: Helm Template (default values)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine/helm:3.14.0 template pv-portal deploy/helm/pv-portal > /tmp/rendered-default.yaml
          echo "✓ Default values template rendered"
          head -100 /tmp/rendered-default.yaml

      - name: Helm Template (dev values - redis enabled)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine/helm:3.14.0 template pv-portal deploy/helm/pv-portal \
            --set redis.enabled=true \
            --set redis.embedded.enabled=true \
            > /tmp/rendered-dev.yaml
          echo "✓ Dev values template rendered"

      - name: Helm Template (prod values - S3 artifacts)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine/helm:3.14.0 template pv-portal deploy/helm/pv-portal \
            --set artifactStore.backend=s3 \
            --set artifactStore.s3.bucket=prod-bucket \
            --set api.replicaCount=3 \
            --set worker.replicaCount=2 \
            > /tmp/rendered-prod.yaml
          echo "✓ Prod values template rendered"

      - name: Verify rendered manifests
        run: |
          # Check that key resources are present
          grep -q "kind: Deployment" /tmp/rendered-default.yaml
          grep -q "kind: Service" /tmp/rendered-default.yaml
          grep -q "kind: ConfigMap" /tmp/rendered-default.yaml
          echo "✓ Required Kubernetes resources present"
