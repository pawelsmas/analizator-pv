name: Nightly Full Build

on:
  schedule:
    # Run every night at 3:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  full-build:
    name: Full Stack Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build all services
        run: |
          # Build ALL services including bess-optimizer (PyPSA/linopy)
          # This catches dependency hash issues early
          docker compose build --parallel

      - name: Start all services
        run: |
          docker compose up -d
          # Wait for all services
          echo "Waiting for services..."
          timeout 180 bash -c 'until curl -sf http://localhost:8031/health; do sleep 2; done'
          echo "bess-dispatch healthy"
          timeout 180 bash -c 'until curl -sf http://localhost:8030/health; do sleep 2; done' || echo "bess-optimizer health check skipped (may have PyPSA issues)"

      - name: Service status
        run: |
          docker compose ps
          docker compose logs --tail=50

      # v1.6.0: Nightly baseline validation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          pip install pyyaml requests

      - name: Run baseline pack validation
        run: |
          python scripts/validate_scenarios.py --pack baseline --json
        env:
          BASE_URL: http://localhost:8031

      # v2.1.0: Pricing scenarios validation
      - name: Run pricing pack validation
        run: |
          python scripts/validate_scenarios.py --pack pricing --json
        env:
          BASE_URL: http://localhost:8031

      - name: Run all scenario validations
        run: |
          python scripts/validate_scenarios.py --json
        env:
          BASE_URL: http://localhost:8031

      - name: Stop services
        if: always()
        run: docker compose down
