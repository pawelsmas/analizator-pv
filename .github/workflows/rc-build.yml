name: RC Build

on:
  push:
    tags:
      - 'v*-rc*'  # Triggers on tags like v2.6.0-rc1
  workflow_dispatch:
    inputs:
      version:
        description: 'RC version (e.g., v2.6.0-rc1)'
        required: true
        type: string

jobs:
  rc-validation:
    name: RC Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pydantic requests

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q --tb=short

      - name: Run contract drift check
        run: |
          python scripts/contracts/export_contracts.py --check

      - name: Validate deprecations registry
        run: |
          python -c "
          import json
          with open('docs/api/deprecations.json') as f:
              data = json.load(f)
          assert 'items' in data, 'Invalid format'
          print(f'Deprecations: {len(data[\"items\"])} items')
          "

  # v3.3.0: PostgreSQL auth integration tests
  rc-auth-postgres:
    name: RC Auth (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bess
          POSTGRES_PASSWORD: bess_test_password
          POSTGRES_DB: bess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://bess:bess_test_password@localhost:5432/bess_test
      AUTH_ENABLED: "true"
      JWT_SECRET: test-secret-for-ci-only
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-admin-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pydantic requests sqlalchemy alembic psycopg bcrypt pyjwt prometheus-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U bess; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Check migrations script
        run: |
          python scripts/db/check_migrations.py

      - name: Run alembic migrations
        run: |
          cd services/bess-dispatch
          alembic upgrade head

      - name: Verify no pending migrations
        run: |
          python scripts/db/check_migrations.py
          if [ $? -ne 0 ]; then
            echo "ERROR: Migrations still pending after upgrade"
            exit 1
          fi

      - name: Run auth repo tests (PostgreSQL)
        run: |
          python -m pytest tests/unit/test_auth_repo.py -v --tb=short

      - name: Run audit repo tests (PostgreSQL)
        run: |
          python -m pytest tests/unit/test_audit_repo.py -v --tb=short

      - name: Run db models tests (PostgreSQL)
        run: |
          python -m pytest tests/unit/test_run_job_index_models.py -v --tb=short

      - name: Run migration contract tests
        run: |
          python -m pytest tests/contract/test_run_job_index_migration.py -v --tb=short

      - name: Run SQLAlchemy repos contract tests
        run: |
          python -m pytest tests/contract/test_sqlalchemy_repos.py -v --tb=short

      - name: Test /health/db endpoint returns ok
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'services/bess-dispatch')
          from db_config import check_db_connection
          result = check_db_connection()
          assert result['ok'], f'Health check failed: {result}'
          assert result['db_backend'] == 'postgres'
          print(f'Health check passed: latency={result[\"latency_ms\"]}ms')
          "

      - name: Test backfill script (dry-run)
        run: |
          python scripts/db/backfill_runs_jobs.py --dry-run --batch-size 10

  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: rc-validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Export contract schemas
        run: |
          pip install pydantic
          python scripts/contracts/export_contracts.py --version ${{ steps.version.outputs.version }}

      - name: Create RC bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist

          # Bundle contract schemas
          cp -r docs/contracts/$VERSION dist/contracts-$VERSION

          # Bundle deprecations
          cp docs/api/deprecations.json dist/deprecations.json

          # Create manifest
          cat > dist/manifest.json << EOF
          {
            "version": "$VERSION",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "artifacts": [
              "contracts-$VERSION/",
              "deprecations.json"
            ]
          }
          EOF

          # Create zip
          cd dist && zip -r ../rc-$VERSION.zip .

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-${{ steps.version.outputs.version }}
          path: rc-*.zip
          retention-days: 30

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: rc-validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            bess-dispatch:${{ steps.version.outputs.version }}
            bess-dispatch:latest-rc
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Export Docker image
        run: |
          docker save bess-dispatch:${{ steps.version.outputs.version }} | gzip > bess-dispatch-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ steps.version.outputs.version }}
          path: bess-dispatch-*.tar.gz
          retention-days: 30
