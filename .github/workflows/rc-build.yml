name: RC Build

on:
  push:
    tags:
      - 'v*-rc*'  # Triggers on tags like v2.6.0-rc1
  workflow_dispatch:
    inputs:
      version:
        description: 'RC version (e.g., v2.6.0-rc1)'
        required: true
        type: string

jobs:
  rc-validation:
    name: RC Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pydantic requests

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q --tb=short

      - name: Run async jobs integration pack
        env:
          BESS_API_URL: http://localhost:8031
          TEST_RUN_ID: test-run-for-validation
        run: |
          # Start services for integration test
          docker-compose up -d bess-dispatch bess-dispatch-worker
          # Wait for services
          sleep 10
          # Run jobs pack validation
          pip install pyyaml
          python scripts/validate_scenarios.py --pack docs/scenarios/packs/jobs_async_auth.yml
          # Cleanup
          docker-compose down

      - name: Run contract drift check
        run: |
          python scripts/contracts/export_contracts.py --check

      - name: Validate deprecations registry
        run: |
          python -c "
          import json
          with open('docs/api/deprecations.json') as f:
              data = json.load(f)
          assert 'items' in data, 'Invalid format'
          print(f'Deprecations: {len(data[\"items\"])} items')
          "

  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: rc-validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Export contract schemas
        run: |
          pip install pydantic
          python scripts/contracts/export_contracts.py --version ${{ steps.version.outputs.version }}

      - name: Create RC bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist

          # Bundle contract schemas
          cp -r docs/contracts/$VERSION dist/contracts-$VERSION

          # Bundle deprecations
          cp docs/api/deprecations.json dist/deprecations.json

          # Create manifest
          cat > dist/manifest.json << EOF
          {
            "version": "$VERSION",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "artifacts": [
              "contracts-$VERSION/",
              "deprecations.json"
            ]
          }
          EOF

          # Create zip
          cd dist && zip -r ../rc-$VERSION.zip .

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-${{ steps.version.outputs.version }}
          path: rc-*.zip
          retention-days: 30

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: rc-validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            bess-dispatch:${{ steps.version.outputs.version }}
            bess-dispatch:latest-rc
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Export Docker image
        run: |
          docker save bess-dispatch:${{ steps.version.outputs.version }} | gzip > bess-dispatch-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ steps.version.outputs.version }}
          path: bess-dispatch-*.tar.gz
          retention-days: 30
