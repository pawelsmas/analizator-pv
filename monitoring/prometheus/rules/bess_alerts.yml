groups:
  - name: bess-dispatch-alerts
    rules:
      - alert: BessDispatchTargetDown
        expr: up{job="pv-backends", instance=~".*bess-dispatch.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "bess-dispatch target DOWN"
          description: "Prometheus cannot scrape bess-dispatch for >2m."

      - alert: BessSizingHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(bess_sizing_duration_seconds_bucket[10m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High sizing p95 latency"
          description: "Sizing p95 > 2s for 10m."

      - alert: BessSizingNoTraffic
        expr: rate(bess_sizing_requests_total[15m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No sizing traffic"
          description: "No sizing requests observed for 30m."

      - alert: BessHttp5xxErrorRateHigh
        expr: |
          (
            sum(rate(http_requests_total{service="bess-dispatch",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="bess-dispatch"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on bess-dispatch"
          description: "5xx error rate > 1% for 5m."

      # v2.7.0: Deprecation usage alerts
      - alert: BessDeprecationUsageHigh
        expr: |
          sum(rate(bess_deprecation_used_total[1h])) > 100
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "High deprecated API usage"
          description: "Deprecated API fields are being used at >100 req/hr. Migration required before sunset."

      - alert: BessLegacyCompatModeHigh
        expr: |
          sum(rate(bess_compat_legacy_responses_total[1h])) > 50
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "High legacy compat mode usage"
          description: "compat=legacy mode usage >50 req/hr. Clients should migrate to compat=clean."

      - alert: BessDeprecationSunsetApproaching
        expr: |
          (vector(1772323200) - time()) < (30 * 24 * 3600) and (vector(1772323200) - time()) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Deprecation sunset approaching"
          description: "Less than 30 days until deprecation sunset (2026-03-01). Ensure all clients are migrated."

      - alert: BessDeprecatedFieldStillUsed
        expr: |
          sum by (field) (rate(bess_deprecation_used_total[24h])) > 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Deprecated field still in use: {{ $labels.field }}"
          description: "The deprecated field '{{ $labels.field }}' is still being used. Check docs/DEPRECATIONS.md for migration guide."
