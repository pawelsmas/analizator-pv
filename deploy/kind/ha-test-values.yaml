# Helm values for HA e2e testing in kind cluster
# v3.6.0 PR6

# Enable HA mode with strict validation
ha:
  enabled: true
  strict: true

# 2 API replicas with PDB
api:
  replicaCount: 2
  image:
    repository: localhost:5000/pv-portal-api
    tag: test
    pullPolicy: Always
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

# 2 Worker replicas with PDB
worker:
  replicaCount: 2
  image:
    repository: localhost:5000/pv-portal-worker
    tag: test
    pullPolicy: Always
  pdb:
    enabled: true
    minAvailable: 1
  concurrency: 2
  queues: default,sizing,batch
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: worker
  knobs:
    maxTasksPerWorker: 100
    memoryThresholdMb: 400
    prefetchMultiplier: 2

# Use database backend for shared state
runstore:
  backend: db
  compress: false

# Enable bundled PostgreSQL
postgresql:
  enabled: true
  auth:
    username: pvportal
    password: test-password-123
    database: pvportal
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Enable bundled Redis
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Enable MinIO for artifacts
minio:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable frontend for faster testing
frontend:
  enabled: false

# Enable ingress for testing
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: pv-portal.local
      paths:
        - path: /
          pathType: Prefix
          service: api

# Service account
serviceAccount:
  create: true
  name: pv-portal

# Enable monitoring for testing
monitoring:
  serviceMonitor:
    enabled: false  # No Prometheus in kind by default
  prometheusRule:
    enabled: false
  grafanaDashboard:
    enabled: false
