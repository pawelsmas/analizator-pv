apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pv-portal.fullname" . }}-test-connection"
  labels:
    {{- include "pv-portal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "pv-portal.fullname" . }}-api:{{ .Values.api.service.port }}/health/live']
  restartPolicy: Never
