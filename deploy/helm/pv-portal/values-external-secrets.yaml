# Example configuration using External Secrets Operator
# for fetching secrets from AWS Secrets Manager

ha:
  enabled: true
  strict: true

api:
  replicaCount: 2

worker:
  replicaCount: 2

runstore:
  backend: db
  # Database URL will be fetched from external secret
  existingSecret: pv-portal-database-secret
  existingSecretKey: DATABASE_URL

postgresql:
  enabled: false
  external:
    host: my-rds-instance.abc123.us-east-1.rds.amazonaws.com
    port: 5432
    database: pvportal
    existingSecret: pv-portal-database-secret
    existingSecretUserKey: username
    existingSecretPasswordKey: password

redis:
  enabled: false
  external:
    host: my-elasticache.abc123.cache.amazonaws.com
    port: 6379
    existingSecret: pv-portal-redis-secret
    existingSecretKey: password

minio:
  enabled: false
  external:
    endpoint: s3.us-east-1.amazonaws.com
    bucket: my-pv-portal-artifacts
    region: us-east-1
    useSSL: true
    existingSecret: pv-portal-s3-secret
    existingSecretAccessKeyKey: access-key
    existingSecretSecretKeyKey: secret-key

# Enable External Secrets Operator integration
externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  secrets:
    database:
      enabled: true
      remoteRef:
        key: prod/pv-portal/database
        # AWS Secrets Manager stores JSON, specify property to extract
        property: connection_string
    redis:
      enabled: true
      remoteRef:
        key: prod/pv-portal/redis
        property: password
    s3:
      enabled: true
      remoteRef:
        key: prod/pv-portal/s3
        # access_key and secret_key properties are expected

# Service account with IRSA for AWS access
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pv-portal-secrets-role
