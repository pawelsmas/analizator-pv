{{- if .Values.externalSecrets.enabled }}
{{/*
External Secrets for fetching secrets from external providers (AWS Secrets Manager, Vault, etc.)
Requires External Secrets Operator to be installed in the cluster.
*/}}
---
{{- if .Values.externalSecrets.secrets.database.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pv-portal.fullname" . }}-database
  labels:
    {{- include "pv-portal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "pv-portal.fullname" . }}-database-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database.remoteRef.key }}
        {{- if .Values.externalSecrets.secrets.database.remoteRef.property }}
        property: {{ .Values.externalSecrets.secrets.database.remoteRef.property }}
        {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.secrets.redis.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pv-portal.fullname" . }}-redis
  labels:
    {{- include "pv-portal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "pv-portal.fullname" . }}-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.redis.remoteRef.key }}
        {{- if .Values.externalSecrets.secrets.redis.remoteRef.property }}
        property: {{ .Values.externalSecrets.secrets.redis.remoteRef.property }}
        {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.secrets.s3.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pv-portal.fullname" . }}-s3
  labels:
    {{- include "pv-portal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "pv-portal.fullname" . }}-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.s3.remoteRef.key }}
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.s3.remoteRef.key }}
        property: secret_key
{{- end }}
{{- end }}
