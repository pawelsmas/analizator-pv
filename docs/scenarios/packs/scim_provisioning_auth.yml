# SCIM Provisioning Auth scenario pack for v4.4.0
# Tests SCIM 2.0 provisioning, group sync, and deprovision flows
name: scim_provisioning_auth
description: |
  Regression scenarios for Enterprise Provisioning: SCIM 2.0 + Group Sync (v4.4.0):
  - SCIM token authentication and lifecycle
  - SCIM Users endpoint (CRUD, filter, pagination)
  - SCIM Groups endpoint (CRUD, membership)
  - Group → Project mapping and sync
  - Deprovision semantics (session/key revocation)
  - Tenant isolation

scenarios:
  # ==========================================================================
  # SCIM Token Management
  # ==========================================================================
  - scim_token_create_with_expiry
  - scim_token_create_no_expiry
  - scim_token_revoke
  - scim_token_expired_rejected
  - scim_token_revoked_rejected
  - scim_token_invalid_rejected
  - scim_token_list_active_only
  - scim_token_last_used_updated

  # ==========================================================================
  # SCIM Base Endpoints (RFC 7644)
  # ==========================================================================
  - scim_service_provider_config
  - scim_resource_types
  - scim_schemas
  - scim_endpoint_requires_bearer_token

  # ==========================================================================
  # SCIM Users CRUD
  # ==========================================================================
  - scim_users_create_basic
  - scim_users_create_with_external_id
  - scim_users_create_duplicate_email_rejected
  - scim_users_get_by_id
  - scim_users_get_not_found
  - scim_users_list_all
  - scim_users_list_paginated
  - scim_users_filter_by_username
  - scim_users_filter_by_email
  - scim_users_filter_by_active
  - scim_users_update_patch
  - scim_users_update_put
  - scim_users_deactivate
