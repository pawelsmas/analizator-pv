  - scim_groups_list_paginated
  - scim_groups_filter_by_displayname
  - scim_groups_update_patch_add_member
  - scim_groups_update_patch_remove_member
  - scim_groups_update_patch_replace_members
  - scim_groups_delete

  # ==========================================================================
  # Group → Project Mapping
  # ==========================================================================
