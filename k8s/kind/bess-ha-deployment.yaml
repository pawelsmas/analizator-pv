# BESS HA Deployment for chaos testing (v3.9.0)
# Deploys BESS with 3 replicas across availability zones
---
apiVersion: v1
kind: Namespace
metadata:
  name: bess
  labels:
    app: bess
    environment: chaos-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bess-dispatch
  namespace: bess
  labels:
    app: bess-dispatch
    version: v3.9.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bess-dispatch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bess-dispatch
        version: v3.9.0
    spec:
      # Spread across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: bess-dispatch

      # Pod disruption budget reference
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bess-dispatch
                topologyKey: kubernetes.io/hostname

      containers:
        - name: bess-dispatch
          image: bess-dispatch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8031
              name: http
          env:
            - name: HA_MODE
              value: "strict"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: RUN_STORE_ENABLED
              value: "true"
            - name: AUTH_MODE
              value: "disabled"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8031
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8031
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: bess-dispatch
  namespace: bess
spec:
  type: NodePort
  selector:
    app: bess-dispatch
  ports:
    - port: 8031
      targetPort: 8031
      nodePort: 30031
      name: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bess-dispatch-pdb
  namespace: bess
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: bess-dispatch

---
# Redis for HA testing (single instance for simplicity)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bess
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
